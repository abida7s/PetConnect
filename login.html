<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PetConnect Login</title>

    <link rel="stylesheet" href="css/login.css">
    
    <!-- Google Font -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">

</head>

<body>

<div class="login-container">


    <!-- LEFT SIDE -->
    <div class="left-section">

        <div class="logo">
            🐾 PetConnect
        </div>

        <h1>
            Welcome Back!
        </h1>

        <p>
            Connect with loving pets and find your perfect companion.
        </p>


        <img src="images/pet.png" class="pet">


    </div>



    <!-- RIGHT SIDE -->
    <div class="right-section">


        <div class="login-box">

            <h2>
                Login
            </h2>

            <p class="subtitle">
                Welcome back! Please login to your account.
            </p>


            <form action="php/login.php" method="POST">


                <div class="input-box">

                    <label>Email</label>

                    <input 
                    type="email" 
                    name="email"
                    placeholder="Enter your email"
                    required>

                </div>



                <div class="input-box">

                    <label>Password</label>

                    <input 
                    type="password"
                    name="password"
                    placeholder="Enter your password"
                    required>

                </div>



                <div class="options">

                    <label>
                        <input type="checkbox">
                        Remember me
                    </label>


                    <a href="#">
                        Forgot Password?
                    </a>

                </div>



                <button type="submit">
                    Login
                </button>



                <p class="register">

                    Don't have an account?

                    <a href="php/register.php">
                        Register
                    </a>

                </p>



            </form>


        </div>


    </div>


</div>


</body>

</html>
